default_install_hook_types = ["pre-commit", "commit-msg"]

[[repos]]
repo = "local"
hooks = [
  {
    id = "prettier",
    name = "Prettier",
    entry = "pnpm exec prettier --check",
    language = "system",
    files = "\\.(css|html|js|json|md|ts|vue|ya?ml)$",
  },
  {
    id = "eslint",
    name = "ESLint",
    entry = "pnpm exec eslint",
    language = "system",
    files = "\\.(ts|vue)$",
  },
  {
    id = "commitlint",
    name = "commitlint",
    entry = "pnpm exec commitlint --edit",
    language = "system",
    stages = ["commit-msg"],
    always_run = true,
  },
]
